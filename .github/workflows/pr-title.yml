name: PR title

# Vérifie que le titre de la pull request suit Conventional Commits.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  conventional-title:
    name: Conventional Commits title
    runs-on: ubuntu-latest
    steps:
      - name: Check pull request title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          PATTERN='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._-]+\))?!?: .+'
          if [[ ! "$PR_TITLE" =~ $PATTERN ]]; then
            echo "::error::Le titre doit suivre Conventional Commits, par exemple « feat: ajouter un écran d'accueil ». Titre reçu : $PR_TITLE"
            exit 1
          fi
          echo "Titre valide : $PR_TITLE"
